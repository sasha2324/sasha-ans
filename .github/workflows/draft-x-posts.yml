# Draft posts for X.
# Every day it looks for new portfolio projects and writes a draft post for each one
# as a GitHub issue (label "post-x"). It NEVER posts on X: Sasha posts by hand.
# Plan: docs/superpowers/specs/2026-11-17-x-post-drafts-design.md
name: Draft posts for X

on:
  schedule:
    # Every day at 07:00 UTC: 08:00 in Italy in winter, 09:00 in summer.
    # GitHub can start it some minutes late.
    - cron: '0 7 * * *'
  # The "Run workflow" button in the Actions tab.
  workflow_dispatch:

# Only what is needed. GitHub creates the GITHUB_TOKEN for each run,
# and the token stops working when the run ends.
permissions:
  contents: write # commit data/annunciati.json
  issues: write # create the "post-x" label and the issues

# Never two runs at the same time: they could create the same issue twice.
concurrency:
  group: draft-x-posts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned to a commit: nobody can change the code behind the version.
      - name: Get the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # If a test fails, the run stops before it creates anything.
      - name: Test the script
        run: node --test 'scripts/x-drafts/*.test.mjs'

      - name: Create the drafts for new projects
        run: node scripts/x-drafts/main.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the list of announced projects
        run: |
          if git diff --quiet -- data/annunciati.json; then
            echo "Nothing to save."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/annunciati.json
          # "[skip ci]" at the start: Cloudflare Pages does not rebuild the site for this commit.
          git commit -m '[skip ci] Drafts for X: update the announced projects'
          git pull --rebase --quiet
          git push
